<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケモンカードBOX 買取・販売 価格比較表（完全版）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .best-shisui { background-color: #fee2e2; } /* 薄い赤 */
        .best-mito { background-color: #fef08a; } /* 薄い黄色 */
        .best-snkr { background-color: #dbeafe; } /* 薄い青 */
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans text-gray-800">

<div class="max-w-7xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
    <div class="bg-blue-700 text-white p-6">
        <h1 class="text-2xl font-bold">ポケモンカードBOX 価格比較表（水戸・酒々井・スニダン）</h1>
        <p class="text-sm mt-2 opacity-90">※スニダン実質手取り = (販売相場 × 0.9) - 送料1,000円 で計算。<br>※一番手元に残る金額が大きいマスがハイライトされます。</p>
    </div>

    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
            <thead>
                <tr class="bg-gray-50 border-b border-gray-200 text-gray-600">
                    <th class="p-3 font-semibold whitespace-nowrap">画像 / BOX名</th>
                    <th class="p-3 font-semibold text-right whitespace-nowrap">酒々井 買取</th>
                    <th class="p-3 font-semibold text-right whitespace-nowrap">水戸 買取</th>
                    <th class="p-3 font-semibold text-right whitespace-nowrap text-gray-400">スニダン 相場</th>
                    <th class="p-3 font-semibold text-right whitespace-nowrap text-blue-600">スニダン 実質</th>
                    <th class="p-3 font-semibold text-center whitespace-nowrap">おすすめ</th>
                </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-gray-200">
                <!-- JavaScriptでデータがここに挿入されます -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // デフォルトのポケモンカード裏面/モンスターボール画像（画像がないBOX用）
    const defaultImg = "https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Pok%C3%A9_Ball_icon.svg/512px-Pok%C3%A9_Ball_icon.svg.png";

    // 抽出・指定された全BOXデータ
    const boxData = [
        { name: "イーブイヒーローズ", shisui: null, mito: null, snkr: 130000, img: null },
        { name: "シャイニースターV", shisui: null, mito: 16000, snkr: 18500, img: null },
        { name: "拡張パック フュージョンアーツ", shisui: null, mito: 42000, snkr: 45000, img: null },
        { name: "拡張パック スターバース", shisui: null, mito: 16000, snkr: 19800, img: null },
        { name: "蒼空ストリーム", shisui: null, mito: null, snkr: 50000, img: null },
        { name: "拡張パック 摩天パーフェクト", shisui: null, mito: null, snkr: 19999, img: null },
        { name: "25th アニバーサリー", shisui: null, mito: 45000, snkr: 48000, img: null },
        { name: "25th ゴールデンボックス", shisui: null, mito: null, snkr: 216000, img: null },
        { name: "スペースジャグラー", shisui: null, mito: 11000, snkr: 13000, img: null },
        { name: "拡張パック タイムゲイザー", shisui: null, mito: 14000, snkr: 17200, img: null },
        { name: "強化拡張 ポケモン GO ボックス", shisui: null, mito: 19000, snkr: 23000, img: "https://cdn.snkrdunk.com/upload_bg_removed/8e3f3dd5-6d71-4e03-b564-586d8815af72.webp?size=m" },
        { name: "拡張パック 仰天のボルテッカー", shisui: null, mito: null, snkr: 46797, img: "https://cdn.snkrdunk.com/upload_bg_removed/720b3f52-f7df-430a-9dcc-6cf86c95360a.webp?size=m" },
        { name: "強化拡張パック ダークファンタズマ", shisui: null, mito: 19000, snkr: 26000, img: null },
        { name: "VSTARユニバース", shisui: 20000, mito: 22000, snkr: 27700, img: null },
        { name: "スタートデッキ100", shisui: 850, mito: null, snkr: 1000, img: "https://cdn.snkrdunk.com/upload_bg_removed/3c75b4b6-47c3-457e-95ee-da2c4ab7442b.webp?size=m" },
        { name: "スカーレットex", shisui: 11000, mito: 10500, snkr: null, img: null },
        { name: "スノーハザード", shisui: 9000, mito: 10000, snkr: 9997, img: "https://cdn.snkrdunk.com/upload_bg_removed/d64a2c5a-fe3c-4f4b-ba7d-36aeb71aebb6.webp?size=m" },
        { name: "クレイバースト", shisui: 9000, mito: 9000, snkr: null, img: null },
        { name: "ポケモンカード151", shisui: 40000, mito: 37000, snkr: 46000, img: null },
        { name: "黒炎の支配者", shisui: 13000, mito: 13000, snkr: 13800, img: "https://cdn.snkrdunk.com/upload_bg_removed/c5504938-3ba8-4d57-847d-01e2b2856f67.webp?size=m" },
        { name: "Yu NAGABA イーブイ", shisui: null, mito: null, snkr: 22000, img: null },
        { name: "強化拡張パック レイジングサーフ", shisui: 11000, mito: 12000, snkr: 13400, img: "https://cdn.snkrdunk.com/upload_bg_removed/cd5054ea-22f1-460c-a3ca-e052bb366afb.webp?size=m" },
        { name: "拡張パック 古代の咆哮", shisui: 8000, mito: 9000, snkr: 9700, img: "https://cdn.snkrdunk.com/upload_bg_removed/67b6b6ab-e2ee-4165-9a81-8782ded42163.webp?size=m" },
        { name: "拡張パック 未来の一閃", shisui: 9000, mito: 8500, snkr: 9400, img: "https://cdn.snkrdunk.com/upload_bg_removed/23a87890-7e5e-41ca-b86f-b4a224c69f21.webp?size=m" },
        { name: "メガシンフォニア", shisui: 6000, mito: 6000, snkr: 6100, img: "https://cdn.snkrdunk.com/upload_bg_removed/fe0052fe-c1e5-4b42-812a-0a11f00d7a55.webp?size=m" },
        { name: "古代の咆哮(開封済)", shisui: 0, mito: 0, snkr: null, img: "https://cdn.snkrdunk.com/upload_bg_removed/67b6b6ab-e2ee-4165-9a81-8782ded42163.webp?size=m" },
        { name: "クリムゾンヘイズ", shisui: null, mito: 10000, snkr: 11999, img: "https://cdn.snkrdunk.com/upload_bg_removed/52e5fc6f-fa1d-4c58-8558-0430a030f44e.webp?size=m" },
        { name: "熱風のアリーナ", shisui: 12000, mito: 15000, snkr: 17000, img: "https://cdn.snkrdunk.com/upload_bg_removed/f03c84f7-9c59-4905-a58b-b3a5c9f9f0da.webp?size=m" },
        { name: "ロケット団の栄光", shisui: 16000, mito: 18000, snkr: null, img: null },
        { name: "ワイルドフォース", shisui: 9000, mito: 9500, snkr: 10100, img: "https://cdn.snkrdunk.com/upload_bg_removed/3e8ae867-e5ac-4952-ac6e-9cf6f286c6f8.webp?size=m" },
        { name: "バトルパートナーズ", shisui: 9000, mito: 8000, snkr: null, img: null },
        { name: "ブラックボルト", shisui: 17000, mito: 17000, snkr: 21998, img: "https://cdn.snkrdunk.com/upload_bg_removed/013524c4-0b78-4564-b38e-b0bb63693033.webp?size=m" },
        { name: "ホワイトフレア", shisui: 17000, mito: 17000, snkr: 22000, img: "https://cdn.snkrdunk.com/upload_bg_removed/02455d85-cd47-4d48-8fa0-d46b50a74079.webp?size=m" },
        { name: "トウホク スペシャルBOX", shisui: null, mito: 9000, snkr: 12700, img: null },
        { name: "シャイニートレジャーex", shisui: 11000, mito: 12000, snkr: 14900, img: "https://cdn.snkrdunk.com/upload_bg_removed/b3044f08-f9bd-466c-b199-56ce8069ff2b.webp?size=m" },
        { name: "テラスタルフェスex", shisui: 12000, mito: 14000, snkr: 16999, img: "https://cdn.snkrdunk.com/upload_bg_removed/277458ab-f9f5-4611-a022-0b9884cb5c6a.webp?size=m" },
        { name: "M6 ストームエメラルダ", shisui: 6500, mito: 8000, snkr: 11899, img: "https://cdn.snkrdunk.com/upload_bg_removed/c08dfabc-735b-4487-8231-06f565c5014c.webp?size=m" },
        { name: "変幻の仮面", shisui: 9000, mito: 10500, snkr: 11800, img: "https://cdn.snkrdunk.com/upload_bg_removed/15c6d89c-51d0-4691-bc1e-1ba1876633a1.webp?size=m" },
        { name: "ステラミラクル", shisui: 8000, mito: 9000, snkr: 9700, img: "https://cdn.snkrdunk.com/upload_bg_removed/76a6228b-5221-4c6a-8ba7-8af875a613a2.webp?size=m" },
        { name: "ロストアビス", shisui: null, mito: 38000, snkr: 48380, img: "https://cdn.snkrdunk.com/upload_bg_removed/dfc67cf9-b661-4601-ad63-8e18dcac30d5.webp?size=m" }
    ];

    const tbody = document.getElementById("table-body");

    // 通貨フォーマット用
    const formatPrice = (price) => price === null || price === 0 ? "-" : price.toLocaleString() + "円";

    boxData.forEach(box => {
        // スニダンの実質価格を計算 ((相場 * 0.9) - 送料1000)
        let snkrReal = null;
        if (box.snkr) snkrReal = Math.floor((box.snkr * 0.9) - 1000);

        // 一番高い売却先を判定
        let maxVal = -Infinity;
        let best = "";
        
        const vals = {
            shisui: box.shisui || -1,
            mito: box.mito || -1,
            snkr: snkrReal || -1
        };

        if (vals.shisui > maxVal) { maxVal = vals.shisui; best = "shisui"; }
        if (vals.mito > maxVal) { maxVal = vals.mito; best = "mito"; }
        if (vals.snkr > maxVal) { maxVal = vals.snkr; best = "snkr"; }
        if (maxVal === -1) best = "none"; // 価格データなしの場合

        // 行のHTMLを生成
        const tr = document.createElement("tr");
        
        // 色付けロジック
        let bestBadge = "-";
        let rowClass = "hover:bg-gray-100 ";
        
        if (best === "shisui") {
            bestBadge = `<span class="px-2 py-1 bg-red-500 text-white text-xs font-bold rounded shadow">酒々井がお得</span>`;
            rowClass += "bg-red-50";
        } else if (best === "mito") {
            bestBadge = `<span class="px-2 py-1 bg-yellow-400 text-yellow-900 text-xs font-bold rounded shadow">水戸がお得</span>`;
            rowClass += "bg-yellow-50";
        } else if (best === "snkr") {
            bestBadge = `<span class="px-2 py-1 bg-blue-500 text-white text-xs font-bold rounded shadow">スニダンがお得</span>`;
            rowClass += "bg-blue-50";
        }

        tr.className = rowClass;

        tr.innerHTML = `
            <td class="p-3 flex items-center gap-3">
                <img src="${box.img ? box.img : defaultImg}" class="w-12 h-12 object-contain bg-white border border-gray-200 rounded p-1" alt="${box.name}">
                <span class="font-medium">${box.name}</span>
            </td>
            <td class="p-3 text-right ${best === 'shisui' ? 'font-bold text-red-600' : ''}">${formatPrice(box.shisui)}</td>
            <td class="p-3 text-right ${best === 'mito' ? 'font-bold text-yellow-600' : ''}">${formatPrice(box.mito)}</td>
            <td class="p-3 text-right text-gray-500">${formatPrice(box.snkr)}</td>
            <td class="p-3 text-right ${best === 'snkr' ? 'font-bold text-blue-600 text-lg' : 'font-medium'}">${formatPrice(snkrReal)}</td>
            <td class="p-3 text-center">${bestBadge}</td>
        `;
        tbody.appendChild(tr);
    });
</script>

</body>
</html>
