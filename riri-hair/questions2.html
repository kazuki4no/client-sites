<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>採用ページ 確認シート（2回目）｜RiRi hair</title>
<link rel="icon" href="favicon.ico" sizes="any">
<style>
/* 代表に記入してもらう確認シート。回答はこのスマホ・PCの中だけに保存され、最後に「コピー」か「共有」で送ってもらう */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{max-width:100%;overflow-x:hidden;}
:root{--bg:#202c35;--ink:#1f2a33;--sub:#5d6a74;--line:#dcd7cc;--paper:#fff;--off:#f6f3ec;--gold:#8a7448;--ok:#2f7f6b;}
body{background:var(--off);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;padding-bottom:150px;}
a{color:var(--gold);}
.head{background:var(--bg);color:#fff;padding:34px 0 30px;}
.wrap{width:min(680px,90%);margin:0 auto;}
.head small{letter-spacing:.14em;font-size:12px;color:#c9b384;}
.head h1{font-size:clamp(1.4rem,5.6vw,1.9rem);line-height:1.5;margin:6px 0 14px;font-weight:700;}
.head p{font-size:14.5px;color:#dfe4e7;margin-bottom:8px;}
.head ol{font-size:14.5px;color:#dfe4e7;padding-left:1.4em;margin-top:10px;}
.views{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
.views a{color:#fff;border:1px solid rgba(255,255,255,.5);padding:8px 14px;font-size:13.5px;text-decoration:none;}

.part{margin-top:44px;}
.part h2{font-size:19px;line-height:1.5;padding-bottom:10px;border-bottom:2px solid var(--ink);}
.part>p{font-size:13.5px;color:var(--sub);margin-top:8px;}
.q{background:var(--paper);border:1px solid var(--line);margin-top:16px;padding:20px 18px 18px;}
.q.done{border-left:4px solid var(--ok);padding-left:15px;}
.q h3{font-size:16.5px;line-height:1.6;}
.q .now{font-size:13px;color:var(--sub);background:var(--off);padding:9px 12px;margin-top:10px;line-height:1.7;}
.q .now b{color:var(--gold);font-weight:700;}
.opts{margin-top:12px;display:grid;gap:8px;}
.opts label{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);padding:12px 14px;cursor:pointer;font-size:15.5px;line-height:1.6;}
.opts input{flex:none;width:20px;height:20px;margin-top:3px;accent-color:var(--bg);}
.opts label:has(input:checked){border-color:var(--bg);background:#eef1f3;}
.q textarea,.q input[type=text]{display:block;width:100%;margin-top:12px;border:1px solid #b9b3a6;border-radius:0;padding:12px;font:inherit;font-size:16px;background:#fff;color:var(--ink);}
.q textarea{min-height:96px;resize:vertical;}
.q .memo{margin-top:10px;font-size:15px;}
.q .lab{display:block;font-size:13px;color:var(--sub);margin-top:14px;}
.q .lab+input,.q .lab+textarea{margin-top:4px;}

.out{margin-top:44px;background:var(--paper);border:1px solid var(--line);padding:20px 18px;display:none;}
.out h2{font-size:17px;margin-bottom:6px;}
.out p{font-size:13.5px;color:var(--sub);}
.out textarea{width:100%;min-height:240px;margin-top:10px;padding:12px;font:inherit;font-size:14px;border:1px solid #b9b3a6;}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);color:#fff;padding:12px 0 14px;box-shadow:0 -2px 12px rgba(0,0,0,.2);z-index:10;}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
.bar .count{flex:1 1 100%;font-size:13px;color:#cfd5d9;}
.bar button{flex:1 1 140px;font:inherit;font-size:15px;font-weight:700;padding:13px 10px;border:0;cursor:pointer;background:#c9b384;color:#1b252d;}
.bar button.sub{background:none;color:#fff;border:1px solid rgba(255,255,255,.6);font-weight:400;}
.reset{display:block;margin:34px auto 0;background:none;border:0;color:var(--sub);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;}
</style>
</head>
<body>

<header class="head">
  <div class="wrap">
    <small>RiRi hair 採用ページ</small>
    <h1>確認シート（2回目）</h1>
    <p>岡田様、ご回答ありがとうございました。いただいた内容は3つの案に反映しました。残りの点を教えてください。</p>
    <ol>
      <li>分かるところだけ、選ぶか記入してください。空欄のままでも大丈夫です。</li>
      <li>入力はこの端末に自動で保存されます。途中で閉じても続きから再開できます。</li>
      <li>終わったら、いちばん下の「回答をコピー」か「共有する」を押して、LINEやメールで送ってください。</li>
    </ol>
    <div class="views">
      <a href="recruit1.html" target="_blank" rel="noopener">A案を見る</a>
      <a href="recruit2.html" target="_blank" rel="noopener">B案を見る</a>
      <a href="recruit3.html" target="_blank" rel="noopener">C案を見る</a>
    </div>
  </div>
</header>

<main class="wrap" id="form"></main>

<div class="wrap">
  <section class="out" id="out">
    <h2>回答のまとめ</h2>
    <p id="outmsg">下の文章をすべて選んでコピーし、LINEやメールに貼り付けて送ってください。</p>
    <textarea id="outtext" readonly></textarea>
  </section>
  <button class="reset" id="reset" type="button">入力をすべて消してやり直す（2回押すと消えます）</button>
</div>

<div class="bar">
  <div class="wrap">
    <span class="count" id="count"></span>
    <button type="button" id="copy">回答をコピー</button>
    <button type="button" id="share" class="sub">共有する</button>
  </div>
</div>

<script>
/* ▼質問の中身。type: radio（1つ選ぶ）/ check（いくつでも）/ text（1行）/ area（文章）/ multi（複数の記入欄）
   now: 今のページでどう書いているか。質問を足す・直すときはここだけ編集すればよい */
var PARTS = [
 {title:'1. 応募の受け口', note:'Instagram の DM、LINE、メールの3つにしました。LINE とメールは連絡先が分からないため、今は「準備中」と表示しています。', qs:[
  {id:'line', type:'text', q:'応募用の LINE を教えてください。', now:'公式アカウントの URL か ID、または友だち追加用のリンクをお願いします。', ph:'例）https://lin.ee/xxxxx または @ririhair'},
  {id:'mail', type:'text', q:'応募用のメールアドレスを教えてください。', ph:'例）info@example.com'},
  {id:'rejobtel', type:'radio', q:'リジョブの応募ボタンと電話番号は、採用ページから外しました。このままでよいですか。', now:'前回の回答で選ばれていなかったため外しています。<b>今のページ：</b>Instagram の DM ボタンのみ押せる状態です。', opts:['外したままでよい','リジョブの応募ボタンも載せる','電話番号も載せる','リジョブも電話も載せる'], memo:'補足があれば'}
 ]},
 {title:'2. 営業時間と料金', note:'', qs:[
  {id:'hours', type:'multi', q:'お客様向けの営業時間と定休日を教えてください。', now:'前回いただいた「09:00〜18:00／12:00〜21:00」は、スタッフの早番・遅番の時間として載せています。お店が開いている時間を教えてください。', fields:[['営業時間','例）9:00〜21:00（最終受付 20:00）'],['定休日','例）毎週月曜・火曜']]},
  {id:'pricechg', type:'area', q:'変わった料金を教えてください。', now:'「変わったものがある」とのことでしたので、<b>今のページ</b>からは料金をすべて外しました。前回載せていた料金：カット一般 ¥4,950／ワンメイクカラー ¥6,950〜／酸性ストレート ¥20,000〜／黒木式酸性ストレート ¥25,000〜／酸性パーマ ¥12,320／ヘッドスパ20分 ¥3,500／ヘアセット ¥4,400／振袖 ¥8,800／ネイル ワンカラー ¥6,500、フルアート ¥12,000、ハンドケア ¥3,300、フットケア ¥4,400／まつげパーマ ¥4,400／ナチュラルブローリフト ¥2,500', ph:'例）カット一般 ¥5,500、まつげパーマ ¥5,000'},
  {id:'priceshow', type:'radio', q:'採用ページに料金を載せますか。', opts:['載せる（正しい料金で）','載せない（今のままでよい）'], memo:''}
 ]},
 {title:'3. 代表からのメッセージ', note:'「書き直したい」とのことでしたので、新しい文章をお願いします。', qs:[
  {id:'ownermsg', type:'area', q:'これから入る方へのメッセージを書いてください。', now:'<b>今のページ：</b>「なるべく、スタッフのやりたい事を現実にしてあげたい。」ほか、リジョブに載っている文章を使っています。箇条書きやメモでも大丈夫です。こちらで整えます。', ph:''}
 ]},
 {title:'4. 募集条件', note:'決まっている範囲で大丈夫です。', qs:[
  {id:'eye_terms', type:'multi', q:'アイラッシュスタッフの条件を教えてください。', now:'<b>今のページ：</b>雇用形態（正社員／アルバイト・パート／業務委託）だけ載せています。', fields:[['給与（正社員）','例）月給◯万円〜'],['給与（アルバイト・パート）','例）時給◯◯円〜'],['報酬（業務委託）','例）歩合◯％'],['勤務時間・日数','例）9:00〜18:00、週◯日から相談可'],['応募資格・経験','例）美容師免許、アイリスト経験◯年以上／未経験可']]},
  {id:'eye_menu', type:'area', q:'アイラッシュのメニューを教えてください。これから増やすものも含めて。', now:'<b>今のページ：</b>まつげパーマ、ナチュラルブローリフト', ph:'例）マツエク、ラッシュリフト、アイブロウ など'},
  {id:'parttime', type:'area', q:'スタイリストのアルバイト・パート、業務委託の条件を教えてください。', now:'<b>今のページ：</b>「募集もあります。条件はお問い合わせください」。このままでよければ空欄で大丈夫です。', ph:'例）パート：時給◯◯円〜、週◯日から\n業務委託：歩合◯％'}
 ]},
 {title:'5. メニューと福利厚生', note:'', qs:[
  {id:'datsumo', type:'multi', q:'脱毛について教えてください。', now:'<b>今のページ：</b>「美容脱毛を店内で行っています。スタッフも福利厚生として利用できます」のみ。', fields:[['メニュー','例）全身、部分、キッズ、メンズ'],['特徴（機器など）','例）痛みが少ない機器'],['担当するスタッフ','']]},
  {id:'bodyfee', type:'radio', q:'整体とヨガは、スタッフは無料で利用できますか。', now:'<b>今のページ：</b>整体は毎週火曜日（日程が合えばいつでも利用可）、ヨガはカフェの営業日。', opts:['どちらも無料','割引で利用できる','通常料金'], memo:'補足があれば'},
  {id:'lunch', type:'text', q:'カフェがお休みの日（月〜木）の昼食は、どうしていますか。', now:'<b>今のページ：</b>「昼食はテラスのカフェで支給」と書いています。カフェの営業は金・土・日とのことでしたので、確認です。', ph:'例）カフェ営業日のみ支給／休みの日はお弁当を支給'}
 ]},
 {title:'6. スタッフの声', note:'あとからでも大丈夫です。届いた分から差し替えます。', qs:[
  {id:'staffmsg', type:'multi', q:'これから入る方へ、スタッフからひとことメッセージをお願いします。', now:'<b>今のページ：</b>公式サイトのスタッフ紹介の文章を抜粋しています。', fields:[['岡田 大輝さん',''],['入倉 唱湖さん',''],['岡田 明日香さん',''],['奥山 輝実さん','']], area:true},
  {id:'day', type:'area', q:'スタッフの1日の流れを教えてください。', now:'<b>今のページ：</b>サンプルです（9:00 出勤・開店準備 → 午前のお客様 → 12:30 昼食 → 午後のお客様 → 16:30 練習 → 18:00 退勤）。', ph:'例）8:10 出勤、掃除と朝礼\n9:00 開店\n…'},
  {id:'iv', type:'area', q:'インタビューの回答をお願いします。', now:'「入れたい」とのことでした。質問の例：RiRiに入ったきっかけは／前の職場といちばん違うところは／技術の練習はどう進めていますか／どんな人が向いていますか。答える方のお名前と一緒に書いてください。', ph:'例）入倉：入ったきっかけは…'}
 ]},
 {title:'7. 公式サイトのメニュー', note:'', qs:[
  {id:'navpos', type:'radio', q:'「スタッフ募集」は、公式サイトのメニューのどこに入れますか。', now:'今の並び：HOME／RIRI News／RiRiネット予約／PRICE／staff／RiRi with...／こだわり／RiRistagram／初めてご来店のお客様へ', opts:['staff の次','いちばん最後','おまかせ'], memo:'ほかの位置ならこちらに'},
  {id:'free', type:'area', q:'ほかに気になることがあれば、自由に書いてください。', ph:''}
 ]}
];

var KEY='riri-recruit-questions-v2', state={}, total=0;
try{ state=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ state={}; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} refresh(); }
function el(tag,cls,html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function field(id,ph,area){
  var f=document.createElement(area?'textarea':'input'); if(!area) f.type='text';
  f.placeholder=ph||''; f.value=state[id]||''; f.dataset.id=id;
  f.addEventListener('input',function(){ state[id]=f.value; save(); }); return f;
}
var form=document.getElementById('form');
PARTS.forEach(function(p){
  var sec=el('section','part'); sec.appendChild(el('h2',null,p.title)); if(p.note) sec.appendChild(el('p',null,p.note));
  p.qs.forEach(function(q){
    total++;
    var box=el('div','q'); box.id='q-'+q.id; box.appendChild(el('h3',null,q.q));
    if(q.now) box.appendChild(el('p','now',q.now));
    if(q.type==='radio'||q.type==='check'){
      var o=el('div','opts');
      q.opts.forEach(function(t,i){
        var l=el('label'), inp=document.createElement('input');
        inp.type=q.type==='radio'?'radio':'checkbox'; inp.name=q.id; inp.value=t;
        var cur=state[q.id]; inp.checked=q.type==='radio'?cur===t:(cur||[]).indexOf(t)>-1;
        inp.addEventListener('change',function(){
          if(q.type==='radio') state[q.id]=t;
          else { var a=(state[q.id]||[]).filter(function(x){return x!==t;}); if(inp.checked) a.push(t); state[q.id]=a; }
          save();
        });
        l.appendChild(inp); l.appendChild(el('span',null,t)); o.appendChild(l);
      });
      box.appendChild(o);
      if(q.memo!=null){ var m=field(q.id+'_memo',q.memo||'補足があれば',q.area); m.classList.add('memo'); box.appendChild(m); }
    } else if(q.type==='multi'){
      q.fields.forEach(function(f,i){ box.appendChild(el('span','lab',f[0])); box.appendChild(field(q.id+'_'+i,f[1],q.area)); });
    } else box.appendChild(field(q.id,q.ph,q.type==='area'));
    sec.appendChild(box);
  });
  form.appendChild(sec);
});

function answerOf(q){
  var lines=[], v;
  if(q.type==='radio'){ if(state[q.id]) lines.push('→ '+state[q.id]); }
  else if(q.type==='check'){ v=state[q.id]||[]; if(v.length) lines.push('→ '+v.join('、')); }
  else if(q.type==='multi'){ q.fields.forEach(function(f,i){ v=(state[q.id+'_'+i]||'').trim(); if(v) lines.push('・'+f[0]+'：'+v); }); }
  else { v=(state[q.id]||'').trim(); if(v) lines.push('→ '+v); }
  v=(state[q.id+'_memo']||'').trim(); if(v) lines.push('（補足）'+v);
  return lines;
}
function build(){
  var out=['【RiRi hair 採用ページ 確認シート（2回目）の回答】',''], n=0;
  PARTS.forEach(function(p){
    var block=[];
    p.qs.forEach(function(q){ var a=answerOf(q); if(a.length){ n++; block.push('■ '+q.q); block=block.concat(a); block.push(''); } });
    if(block.length){ out.push('＜'+p.title+'＞'); out=out.concat(block); }
  });
  if(!n) out.push('（まだ回答がありません）');
  return {text:out.join('\n'),n:n};
}
function refresh(){
  var n=0;
  PARTS.forEach(function(p){ p.qs.forEach(function(q){ var d=answerOf(q).length>0; if(d) n++; document.getElementById('q-'+q.id).classList.toggle('done',d); }); });
  document.getElementById('count').textContent='回答済み '+n+' / '+total+'問（空欄があっても送れます）';
  var o=document.getElementById('out'); if(o.style.display==='block') document.getElementById('outtext').value=build().text;
}
function showOut(msg){
  var o=document.getElementById('out'); o.style.display='block';
  document.getElementById('outtext').value=build().text; document.getElementById('outmsg').textContent=msg;
  o.scrollIntoView({behavior:'smooth',block:'start'});
}
var copyBtn=document.getElementById('copy'), shareBtn=document.getElementById('share');
copyBtn.addEventListener('click',function(){
  var t=build().text;
  function ok(){ copyBtn.textContent='コピーしました'; setTimeout(function(){copyBtn.textContent='回答をコピー';},2500); showOut('コピーしました。LINEやメールに貼り付けて送ってください。うまく貼れないときは、下の文章を選んでコピーしてください。'); }
  function ng(){ showOut('下の文章をすべて選んでコピーし、LINEやメールに貼り付けて送ってください。'); var ta=document.getElementById('outtext'); ta.focus(); ta.select(); }
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok,ng); else ng();
});
if(navigator.share){
  shareBtn.addEventListener('click',function(){ navigator.share({title:'RiRi hair 採用ページ 確認シート（2回目）の回答',text:build().text}).catch(function(){}); });
} else shareBtn.style.display='none';
var armed=false, resetBtn=document.getElementById('reset');
resetBtn.addEventListener('click',function(){
  if(!armed){ armed=true; resetBtn.textContent='もう一度押すと、入力がすべて消えます'; setTimeout(function(){armed=false;resetBtn.textContent='入力をすべて消してやり直す（2回押すと消えます）';},4000); return; }
  try{ localStorage.removeItem(KEY); }catch(e){} location.reload();
});
refresh();
</script>
</body>
</html>
